; Speed-oriented defaults for a slow target. Installed to sd:/ppsspp/PSP/SYSTEM/ppsspp.ini
; Key names were checked against the wiiu branch's Core/Config.cpp.
; The game-specific overrides PPSSPP supports (<GAMEID>_ppsspp.ini) win over this file.

[CPU]
; 0 = interpreter, 1 = JIT (the branch's PowerPC JIT), 2 = IR interpreter.
; Try 1 first. If a game crashes or glitches, try 2, then 0. See README.
CPUCore = 1
SeparateIOThread = True
IOTimingMethod = 0
FastMemoryAccess = True
FuncReplacements = True
HideSlowWarnings = True
CPUSpeed = 0

[Graphics]
RenderingMode = 1
InternalResolution = 1
; Skip every other frame. Set to 0 for no skipping, 2+ for more.
FrameSkip = 1
FrameSkipType = 0
AutoFrameSkip = False
FrameRate = 0
VSyncInterval = False
TexScalingLevel = 1
TexScalingType = 0
TexDeposterize = False
AnisotropyLevel = 0
HardwareTessellation = False
SplineBezierQuality = 0
SoftwareSkinning = True
TextureShader = Off
BloomHack = 0
DisableSlowFramebufEffects = True
FragmentTestCache = True
TextureSecondaryCache = False
ReplaceTextures = False
ShowFPSCounter = 1
